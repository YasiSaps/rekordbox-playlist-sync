name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          rbsync --version
          rbsync --help

  installers:
    name: installer / ${{ matrix.os }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      RBSYNC_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run macOS installer
        if: runner.os == 'macOS'
        run: |
          bash install/install.sh
          ~/.local/bin/rbsync --version
          test -d ~/Applications/"rbsync Playlist Updater.app"
      - name: Run Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install/install.ps1
          & "$env:LOCALAPPDATA\rbsync\bin\rbsync.cmd" --version
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\SendTo\rbsync - Update rekordbox playlist.cmd")) { throw "Send to entry missing" }
